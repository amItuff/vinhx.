        <div class="avatar-mini-wrap">

        </div>

        <div class="info-block">
          <span class="category-label">DISCORD</span>
          <div class="user-headline">
            <span class="user-display">vinhx</span>
            <span class="handle-name">nntv_1.</span>
          </div>

          <!-- ĐẦY ĐỦ 4 BADGE VECTOR/PNG -->

    <div class="glass-card">
      <div class="card-body-left">
        <img id="sc-thumb" class="square-thumb" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200&auto=format&fit=crop&q=80" alt="Track Art" />

          <span class="category-label">LISTENING TO SOUNDCLOUD</span>

        </div>

        <div id="track-name" class="track-headline">PAR SG - cigarette ft. Cigar</div>

        <div class="progress-container">

          <div id="progress-bar-slot" class="progress-bar-slot">
            <div id="progress-bar-val" class="progress-bar-val"></div>
          </div>
          <span id="time-max">2:42</span>
        </div>

        <div class="controls-toolbar">
          <div class="buttons-pack">
            <button id="ctrl-prev" class="tool-btn" title="Restart"><i class="fa-solid fa-backward-step"></i></button>
            <button id="ctrl-play" class="tool-btn play-active" title="Play/Pause"><i id="ctrl-play-icon" class="fa-solid fa-pause"></i></button>
            <button id="ctrl-next" class="tool-btn" title="Loop"><i class="fa-solid fa-forward-step"></i></button>
          </div>

          <div class="volume-tool">
            <i class="fa-solid fa-volume-low"></i>
            <input id="vol-range" type="range" class="vol-range" min="0" max="100" value="85" />
