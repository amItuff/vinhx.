<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>vinhx</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap&subset=latin,vietnamese" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://w.soundcloud.com/player/api.js"></script>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

  <!-- Màn hình click để vào web và kích hoạt phát nhạc -->
  <div id="enter-screen">
    <div class="enter-box">
      <div class="enter-title">click to enter...</div>
      <div class="enter-sub">vinhx profile</div>
    </div>
  </div>

  <!-- Background GIF và lớp phủ tối ưu (không tụt FPS) -->
  <div class="bg-layer"></div>
  <div class="bg-vignette"></div>

  <!-- ================= TẦNG 1: HERO ================= -->
  <main class="hero-view">
    <div class="avatar-orbit">
      <div class="dark-aura"></div>
      <img id="main-avatar" class="avatar-face" src="https://images.squarespace-cdn.com/content/v1/54fc8146e4b02a22841f4df7/1598462744654-K3B5K62R45A3S7C71PZP/Patrick_Star_in_hoodie.png" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" alt="vinhx" />
    </div>

    <h1 class="hero-name">vinhx</h1>
    <p class="hero-tagline">Contact below</p>

    <div class="social-cluster">
      <a href="https://www.facebook.com/trivinhnguyenuwu" target="_blank" rel="noopener noreferrer" class="social-circle" title="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
      <a href="https://discord.com/users/1054712893037355018" target="_blank" rel="noopener noreferrer" class="social-circle" title="Discord">
        <i class="fa-brands fa-discord"></i>
      </a>
      <a href="https://soundcloud.com/parsg/par-sg-cigarette-ft-cigar" target="_blank" rel="noopener noreferrer" class="social-circle" title="SoundCloud">
        <i class="fa-brands fa-soundcloud"></i>
      </a>
    </div>

    <!-- Nút cuộn dùng JS để KHÔNG bị hiện #cards-view trên URL -->
    <div id="scroll-hint-btn" class="scroll-down-hint">
      <span>SCROLL</span>
      <i class="fa-solid fa-chevron-down"></i>
    </div>
  </main>

  <!-- ================= TẦNG 2: CARDS & NHẠC ================= -->
  <section id="cards-view" class="cards-view">

    <!-- THẺ 1: DISCORD PROFILE ĐẦY ĐỦ 4 BADGE CHUẨN ACC -->
    <div class="glass-card">
      <div class="card-body-left">
        <div class="avatar-mini-wrap">
          <img id="card-avatar" class="avatar-mini" src="https://images.squarespace-cdn.com/content/v1/54fc8146e4b02a22841f4df7/1598462744654-K3B5K62R45A3S7C71PZP/Patrick_Star_in_hoodie.png" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" alt="vinhx" />
          <div class="status-indicator dnd" title="Do Not Disturb"></div>
        </div>

        <div class="info-block">
          <span class="category-label">DISCORD</span>
          <div class="user-headline">
            <span class="user-display">vinhx</span>
            <span class="handle-name">nntv_1.</span>
          </div>

          <!-- ĐẦY ĐỦ 4 BADGE THEO ĐÚNG LINK RAW TRÊN GITHUB -->
          <div class="badges-row">
            <img class="badge-icon" src="https://raw.githubusercontent.com/mezotv/discord-badges/main/assets/subscriptions/badges/silver.png" alt="Silver Nitro" title="Nitro Silver" />
            <img class="badge-icon" src="https://raw.githubusercontent.com/mezotv/discord-badges/main/assets/gifting/legend.png" alt="Legend Gift" title="Gifting Legend" />
            <img class="badge-icon" src="https://raw.githubusercontent.com/mezotv/discord-badges/main/assets/game-time/eternal.svg" alt="Eternal" title="Game Time: Eternal" />
            <img class="badge-icon" src="https://raw.githubusercontent.com/mezotv/discord-badges/main/assets/game-variety/universalist.svg" alt="Universalist" title="Game Variety: Universalist" />
          </div>
        </div>
      </div>
      <a href="https://discord.com/users/1054712893037355018" target="_blank" class="discord-btn">PROFILE</a>
    </div>

    <!-- THẺ 2: SOUNDCLOUD ACTIVITY -->
    <div class="glass-card">
      <div class="card-body-left">
        <img id="sc-thumb" class="square-thumb" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200&auto=format&fit=crop&q=80" alt="Track Art" />
        <div class="info-block">
          <span class="category-label">LISTENING TO SOUNDCLOUD</span>
          <span id="sc-title" class="title-bold">PAR SG - cigarette ft. Cigar</span>
          <span class="sub-muted">PAR SG</span>
        </div>
      </div>
    </div>

    <!-- THẺ 3: FACEBOOK LOGO CHÍNH THỨC -->
    <div class="glass-card">
      <div class="card-body-left">
        <div class="fb-logo-brand">
          <i class="fa-brands fa-facebook-f"></i>
        </div>
        <div class="info-block">
          <span class="category-label">SOCIAL NETWORK</span>
          <span class="title-bold">Tri Vinh Nguyen</span>
          <span class="sub-muted">facebook.com/trivinhnguyenuwu</span>
        </div>
      </div>
      <a href="https://www.facebook.com/trivinhnguyenuwu" target="_blank" class="discord-btn">CONNECT</a>
    </div>

    <!-- CUSTOM AUDIO PLAYER ĐỒNG BỘ SOUNDCLOUD -->
    <div class="audio-player-panel">
      <div class="disk-container">
        <img id="disk-image" class="disk-spinner" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200&auto=format&fit=crop&q=80" alt="Disk" />
        <div class="audio-bars">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>

      <div class="player-controls">
        <span class="category-label">NOW PLAYING</span>
        <div id="track-name" class="track-headline">PAR SG - cigarette ft. Cigar</div>

        <div class="progress-container">
          <span id="time-curr">0:00</span>
          <div id="progress-bar-slot" class="progress-bar-slot">
            <div id="progress-bar-val" class="progress-bar-val"></div>
          </div>
          <span id="time-max">2:42</span>
        </div>

        <div class="controls-toolbar">
          <div class="buttons-pack">
            <button id="ctrl-prev" class="tool-btn" title="Restart"><i class="fa-solid fa-backward-step"></i></button>
            <button id="ctrl-play" class="tool-btn play-active" title="Play/Pause"><i id="ctrl-play-icon" class="fa-solid fa-play"></i></button>
            <button id="ctrl-next" class="tool-btn" title="Loop"><i class="fa-solid fa-forward-step"></i></button>
          </div>

          <div class="volume-tool">
            <i class="fa-solid fa-volume-low"></i>
            <input id="vol-range" type="range" class="vol-range" min="0" max="100" value="85" />
            <i class="fa-solid fa-volume-high"></i>
          </div>
        </div>
      </div>
    </div>

  </section>

  <!-- ĐỒNG HỒ VIỆT NAM (GMT+7) -->
  <div class="vn-clock-badge">
    <i class="fa-regular fa-clock"></i>
    <span id="vn-clock-display">VN (GMT+7) --:--:--</span>
  </div>

  <!-- Iframe SoundCloud ẩn -->
  <iframe
    id="sc-hidden-frame"
    allow="autoplay"
    src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/parsg/par-sg-cigarette-ft-cigar&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false">
  </iframe>

  <script src="script.js"></script>
</body>
</html>
