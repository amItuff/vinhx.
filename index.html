<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>vinhx — profile</title>

  <!-- Google Fonts hỗ trợ trọn vẹn bảng mã tiếng Việt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap&subset=latin,vietnamese" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- SoundCloud Widget API -->

  <style>
    :root {
      --card-bg: rgba(22, 24, 29, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f2f3f5;
      --text-sub: #949ba4;
      --discord-green: #248046;
      --discord-green-hover: #1a6334;
      --fb-blue: #1877f2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: #0d0e12;
      overflow-x: hidden;
      min-height: 100vh;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0d0e12;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    /* Background Banner GIF mới - êm mắt */
    .bg-wrapper {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url('https://i.pinimg.com/originals/b9/4e/18/b94e18ea40626f10bc67eaba042ec415.gif') center center / cover no-repeat;
      transform: scale(1.02);
    }

    /* Lớp phủ điện ảnh tối màu */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at center, rgba(13, 15, 18, 0.45) 0%, rgba(7, 8, 10, 0.88) 100%);
      backdrop-filter: blur(1.5px);
    }

    /* ================= TẦNG 1: HERO ================= */
    .hero-section {
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
      padding: 20px;
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
      position: relative;
      z-index: 1;
      background: #111214;
    }

    /* Hiệu ứng viền hào quang bóng tối giống trên profile */
    .avatar-aura {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.6) 0%, rgba(147, 51, 234, 0.2) 60%, transparent 80%);
      filter: blur(4px);
      z-index: 0;
      animation: pulseAura 3s infinite alternate ease-in-out;
    }

    @keyframes pulseAura {
      0% { transform: scale(0.96); opacity: 0.5; }
      100% { transform: scale(1.04); opacity: 0.9; }
    }

    .hero-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 3.8rem;
      font-weight: 400;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      margin-bottom: 8px;
    }

    .hero-desc {
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 22px;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .social-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      transform: translateY(-2px);
    }

    .scroll-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      transition: color 0.2s;
    }
    .scroll-hint:hover {
      color: #fff;
    }
    .scroll-hint i {
      animation: floatDown 1.8s infinite;
    }

    @keyframes floatDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }

    /* ================= TẦNG 2: THẺ CARDS & PLAYER ================= */
    .details-section {
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 16px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }

    .glass-box {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .glass-box:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .box-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .box-avatar-wrap {
      position: relative;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    .box-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #111214;
    }

    /* Nút chấm đỏ Do Not Disturb */
    .dnd-dot {
      position: absolute;
      bottom: 0px;
      right: 0px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #f23f43;
      border: 2.5px solid #16181d;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dnd-dot::after {
      content: '';
      width: 6px;
      height: 2px;
      background-color: #fff;
      border-radius: 1px;
    }

    /* Khối Logo Facebook */
    .fb-logo-square {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(145deg, #1877f2, #0d65d9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.75rem;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(24, 119, 242, 0.35);
    }

    .sc-thumb-square {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .box-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .box-tag {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
    }

    .box-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .box-sub {
      font-size: 0.76rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Dải huy hiệu Discord chuẩn của ID 1054712893037355018 */
    .discord-badge-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    /* Huy hiệu 10 Năm Discord (Red Circle 10) */
    .ten-year-badge {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #111214;
      border: 1.8px solid #f23f43;
      color: #f2f3f5;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 6px rgba(242, 63, 67, 0.6);
      flex-shrink: 0;
    }

    /* Cụm Tag Icon [ 🛞 🎁 🗡️ 🎮 ] */
    .tag-icons-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 0.68rem;
      line-height: 1.2;
    }

    .action-btn {
      background-color: var(--discord-green);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 6px;
      text-decoration: none;
      flex-shrink: 0;
      transition: background-color 0.2s ease;
    }
    .action-btn:hover {
      background-color: var(--discord-green-hover);
    }

    /* ================= CUSTOM MUSIC PLAYER ================= */
    .player-section {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 4px;
    }

    .player-disk-box {
      position: relative;
      width: 62px;
      height: 62px;
      flex-shrink: 0;
    }

    .player-disk {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.15);
      animation: rotateDisk 12s linear infinite;
      animation-play-state: running;
    }
    .player-disk.paused {
      animation-play-state: paused;
    }

    @keyframes rotateDisk {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .mini-equalizer {
      position: absolute;
      bottom: -3px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
      background: rgba(10, 11, 14, 0.9);
      padding: 2px 4px;
      border-radius: 4px;
    }
    .mini-eq-bar {
      width: 2px;
      height: 3px;
      background: #fff;
      border-radius: 1px;
    }
    .playing .mini-eq-bar:nth-child(1) { animation: eqJump 0.6s infinite ease-in-out; }
    .playing .mini-eq-bar:nth-child(2) { animation: eqJump 0.8s infinite ease-in-out 0.2s; }
    .playing .mini-eq-bar:nth-child(3) { animation: eqJump 0.5s infinite ease-in-out 0.4s; }

    @keyframes eqJump {
      0%, 100% { height: 3px; }
      50% { height: 9px; }
    }

    .player-controls-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .player-track-name {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 1.25rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-line-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-sub);
    }

    .progress-bar {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 3px;
    }

    .player-bottom-btns {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .round-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .round-btn.play-toggle {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.18);
    }
    .round-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .vol-ctrl {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 140px;
      color: var(--text-sub);
      font-size: 0.68rem;
    }

    .vol-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    .vol-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    /* ================= GÓC DƯỚI TRÁI: VIETNAM TIME (GMT+7) ================= */
    .vn-time-hud {
      position: fixed;
      bottom: 16px;
      left: 18px;
      z-index: 50;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    /* Iframe SoundCloud ẩn */
    #sc-audio-bridge {
      position: fixed;
      width: 1px;
      height: 1px;
      bottom: -10px;
      left: -10px;
      opacity: 0;
      pointer-events: none;
    }

    /* Tối ưu điện thoại */
    @media (max-width: 600px) {
      .hero-title {
        font-size: 3.2rem;
      }
      .details-section {
        padding: 20px 14px 70px;
      }
      .vn-time-hud {
        bottom: 12px;
        left: 14px;
        font-size: 0.65rem;
      }
    }
  </style>
</head>

  <script>
    /* =========================================================================
       1. CẬP NHẬT THỜI GIAN VIỆT NAM (GMT+7)
       ========================================================================= */
    function refreshVNTime() {
      const now = new Date();
      const options = {
        timeZone: 'Asia/Ho_Chi_Minh',
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      const formatted = new Intl.DateTimeFormat('en-GB', options).format(now);
      document.getElementById('vn-clock-text').textContent = `VN (GMT+7) ${formatted}`;
    }
    setInterval(refreshVNTime, 1000);
    refreshVNTime();

    /* =========================================================================
       2. ĐỒNG BỘ DỮ LIỆU DISCORD ID: 1054712893037355018
       ========================================================================= */
    const DISCORD_UID = '1054712893037355018';

    async function fetchDiscordData() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_UID}`);
        if (res.ok) {
          const json = await res.json();
          if (json.success && json.data) {
            const user = json.data.discord_user;
            if (user?.avatar) {
              const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
              const pfpUrl = `https://cdn.discordapp.com/avatars/${DISCORD_UID}/${user.avatar}.${ext}?size=256`;
              document.getElementById('main-avatar').src = pfpUrl;
              document.getElementById('card-discord-avatar').src = pfpUrl;
            }
          }
        }
      } catch (_) {}
    }
    fetchDiscordData();

    /* =========================================================================
       3. TỰ ĐỘNG PHÁT NHẠC & ĐIỀU KHIỂN SOUNDCLOUD
       ========================================================================= */
    const scIframe = document.getElementById('sc-audio-bridge');
    const player = SC.Widget(scIframe);
    let totalDuration = 162000;
    let audioInitiated = false;

    function formatMSS(ms) {
      const sec = Math.floor(ms / 1000);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Tự động phát khi widget sẵn sàng
    player.bind(SC.Widget.Events.READY, () => {
      player.setVolume(85);
      player.play();

      player.getDuration((d) => {
        if (d > 0) {
          totalDuration = d;
          document.getElementById('max-time').textContent = formatMSS(d);
        }
      });

      player.getCurrentSound((s) => {
        if (s?.artwork_url) {
          const cover = s.artwork_url.replace('-large', '-t500x500');
          document.getElementById('track-art-box').src = cover;
          document.getElementById('rotating-disk').src = cover;
        }
      });
    });

    // Dự phòng: Mở khóa âm thanh ngay ở lần chạm/cuộn đầu tiên trên điện thoại nếu trình duyệt chặn tự phát
    function triggerFirstInteraction() {
      if (!audioInitiated) {
        audioInitiated = true;
        player.play();
      }
    }
    ['click', 'touchstart', 'scroll', 'pointerdown'].forEach((evt) => {
      window.addEventListener(evt, triggerFirstInteraction, { once: true, passive: true });
    });

    player.bind(SC.Widget.Events.PLAY, () => {
      document.getElementById('play-symbol').className = 'fa-solid fa-pause';
      document.getElementById('rotating-disk').classList.remove('paused');
      document.querySelector('.player-disk-box').classList.add('playing');
    });

    player.bind(SC.Widget.Events.PAUSE, () => {
      document.getElementById('play-symbol').className = 'fa-solid fa-play';
      document.getElementById('rotating-disk').classList.add('paused');
      document.querySelector('.player-disk-box').classList.remove('playing');
    });

    player.bind(SC.Widget.Events.PLAY_PROGRESS, (e) => {
      document.getElementById('curr-time').textContent = formatMSS(e.currentPosition);
      if (totalDuration > 0) {
        const pct = (e.currentPosition / totalDuration) * 100;
        document.getElementById('progress-fill').style.width = `${Math.min(100, pct)}%`;
      }
    });

    player.bind(SC.Widget.Events.FINISH, () => {
      player.seekTo(0);
      player.play();
    });

    document.getElementById('btn-toggle').addEventListener('click', () => player.toggle());
    document.getElementById('btn-restart').addEventListener('click', () => { player.seekTo(0); player.play(); });
    document.getElementById('btn-loop').addEventListener('click', () => { player.seekTo(0); player.play(); });

    document.getElementById('progress-track').addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      player.seekTo(pos * totalDuration);
    });

    document.getElementById('vol-slider').addEventListener('input', function() {
      player.setVolume(Number(this.value));
    });

    /* =========================================================================
       4. CHỐNG SAO CHÉP & BẢO VỆ MÃ NGUỒN
       ========================================================================= */
    if (window.top !== window.self) window.top.location = window.self.location;
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      const k = e.key?.toLowerCase();
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(k)) ||
        (e.ctrlKey && ['u', 's', 'c', 'a', 'p'].includes(k))
      ) {
        e.preventDefault();
        return false;
      }
    });
  </script>
</body>
</html>
